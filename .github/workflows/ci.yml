name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --frozen --no-editable

      - name: Run Ruff
        run: .venv/bin/ruff check .

      - name: Run pytest
        run: .venv/bin/python -m pytest

  docker:
    name: Docker build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag zifisense-maintenance-agent-demo:${{ github.sha }} .

      - name: Verify non-root image configuration
        run: |
          test "$(docker inspect --format '{{.Config.User}}' zifisense-maintenance-agent-demo:${{ github.sha }})" = "agent"

      - name: Run container smoke tests
        run: |
          docker run --detach --name zifisense-agent-ci --publish 18080:8080 zifisense-maintenance-agent-demo:${{ github.sha }}
          trap 'docker logs zifisense-agent-ci; docker rm --force zifisense-agent-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep '"status":"ok"' /tmp/health.json
          curl --fail --silent --request POST http://127.0.0.1:18080/mcp \
            --header 'Authorization: Bearer dev-evaluator-key' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2026-07-28' \
            --header 'Mcp-Method: server/discover' \
            --data '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
            | grep '2026-07-28'
